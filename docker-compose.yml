services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bazar
      POSTGRES_PASSWORD: bazar
      POSTGRES_DB: bazar
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Expuesto solo para desarrollo local (npm run dev conecta acá).
    # Se usa 5433 en el host porque 5432 suele estar ocupado por otros Postgres.
    # En el VPS se puede quitar este bloque de ports: la app llega por la red interna.
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bazar -d bazar"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://bazar:bazar@db:5432/bazar
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-cambiar-esta-clave}
      SESSION_SECRET: ${SESSION_SECRET:-cambiar-este-secreto}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    ports:
      - "3010:3000"

volumes:
  pgdata:
  uploads:
