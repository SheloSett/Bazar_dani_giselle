services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bazar
      POSTGRES_PASSWORD: bazar
      POSTGRES_DB: bazar
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Para desarrollo local (npm run dev conecta acá). Se usa 5433 en el host
    # porque 5432 suele estar ocupado por otros Postgres.
    # Atado a 127.0.0.1: Docker se saltea el firewall del VPS (ufw), así que
    # publicarlo en todas las interfaces dejaría la base abierta a internet.
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bazar -d bazar"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://bazar:bazar@db:5432/bazar
      # Obligatorias (van en .env): sin ellas docker compose no arranca
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Falta ADMIN_PASSWORD en .env}
      SESSION_SECRET: ${SESSION_SECRET:?Falta SESSION_SECRET en .env (generar con openssl rand -hex 32)}
      UPLOAD_DIR: /app/uploads
      # Opcional: URL pública para la vista previa al compartir el link
      SITE_URL: ${SITE_URL:-}
    volumes:
      - uploads:/app/uploads
    # Solo en 127.0.0.1: desde afuera se entra por el proxy (Caddy), que le pone
    # HTTPS y le pasa a la app la IP real de cada visita
    ports:
      - "127.0.0.1:3010:3000"

volumes:
  pgdata:
  uploads:
